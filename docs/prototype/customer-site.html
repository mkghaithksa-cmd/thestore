<style>
/* Layout: desktop-first customer website (top nav, wide grids, two-column checkout) that collapses to one column on phones. A thin review bar + drawer carries the reviewer notes. Tokens from Design System Foundations. */
:root{
  --primary-50:#f0f9ff;--primary-100:#e0f2fe;--primary-500:#38bdf8;--primary-600:#0ea5e9;--primary-700:#0369a1;
  --n50:#f8fafc;--n100:#f1f5f9;--n200:#e2e8f0;--n300:#cbd5e1;--n400:#94a3b8;--n500:#566377;--n700:#334155;--n900:#0f172a;
  --surface:#ffffff;
  --ok-50:#f0fdf4;--ok-500:#22c55e;--ok-700:#15803d;
  --warn-50:#fffbeb;--warn-500:#f59e0b;--warn-700:#b45309;
  --bad-50:#fef2f2;--bad-500:#ef4444;--bad-700:#b91c1c;
  --btn-text:#ffffff;--hero-a:#0369a1;--hero-b:#0ea5e9;
  --font:"IBM Plex Sans Arabic","Tajawal",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --primary-50:#0b2a3d;--primary-100:#0c3a55;--primary-700:#7dd3fc;--primary-600:#38bdf8;
  --n50:#0b1220;--n100:#1e293b;--n200:#334155;--n300:#475569;--n400:#94a3b8;--n500:#a3b1c4;--n700:#cbd5e1;--n900:#f1f5f9;
  --surface:#131c2e;--ok-50:#0e2a1a;--ok-700:#4ade80;--warn-50:#2e2208;--warn-700:#fbbf24;--bad-50:#321416;--bad-700:#f87171;
  --btn-text:#06202f;--hero-a:#0c4a6e;--hero-b:#0369a1;color-scheme:dark}}
:root[data-theme="dark"]{
  --primary-50:#0b2a3d;--primary-100:#0c3a55;--primary-700:#7dd3fc;--primary-600:#38bdf8;
  --n50:#0b1220;--n100:#1e293b;--n200:#334155;--n300:#475569;--n400:#94a3b8;--n500:#a3b1c4;--n700:#cbd5e1;--n900:#f1f5f9;
  --surface:#131c2e;--ok-50:#0e2a1a;--ok-700:#4ade80;--warn-50:#2e2208;--warn-700:#fbbf24;--bad-50:#321416;--bad-700:#f87171;
  --btn-text:#06202f;--hero-a:#0c4a6e;--hero-b:#0369a1;color-scheme:dark}
*{box-sizing:border-box}
.cols>*,.two>*{min-width:0}
[hidden]{display:none!important}
body{background:var(--n50);color:var(--n900);font-family:var(--font);direction:rtl;font-size:15px;line-height:1.7;padding-inline:0;padding-block:0}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary-600);outline-offset:2px}
.wrap{max-width:1160px;margin-inline:auto;padding-inline:20px}
/* review bar */
.review{background:var(--n900);color:var(--n50);font-size:13px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
:root[data-theme="dark"] .review{background:#020617;color:#e2e8f0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .review{background:#020617;color:#e2e8f0}}
.review .wrap{display:flex;align-items:center;gap:12px;min-height:42px;flex-wrap:wrap;padding-block:6px}
.review b{font-weight:600}
.review .sp{flex:1}
.review button{background:rgba(148,163,184,.22);border:0;color:inherit;border-radius:8px;padding:5px 12px;font-size:12px}
.review .pill{background:var(--primary-600);color:#06202f;border-radius:99px;padding:1px 10px;font-size:11px;font-weight:600}
/* header */
.hdr{background:var(--surface);border-bottom:1px solid var(--n200)}
.hdr .wrap{display:flex;align-items:center;gap:22px;min-height:68px;flex-wrap:wrap;padding-block:8px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--primary-700);font-size:22px;background:none;border:0;padding:0}
.logo svg{width:28px;height:28px}
.nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.nav button{background:none;border:0;padding:8px 14px;border-radius:8px;color:var(--n700);font-weight:500}
.nav button:hover{background:var(--n100)}
.nav button.on{color:var(--primary-700);background:var(--primary-50);font-weight:600}
.hact{display:flex;gap:8px;align-items:center}
.iconbtn{background:var(--n100);border:0;width:42px;height:42px;border-radius:10px;display:grid;place-items:center;position:relative;color:var(--n700)}
.iconbtn svg{width:20px;height:20px}
.dot{position:absolute;top:-4px;inset-inline-start:-4px;background:var(--bad-500);color:#fff;font-size:11px;min-width:18px;height:18px;border-radius:99px;display:grid;place-items:center;font-weight:600}
main{padding-block:28px 56px;min-height:60vh}
.crumbs{font-size:13px;color:var(--n500);margin-bottom:16px;display:flex;gap:6px;flex-wrap:wrap}
.crumbs button{background:none;border:0;color:var(--primary-700);padding:0}
.page-h{font-size:26px;font-weight:700;margin:0 0 6px}
.sub{color:var(--n500);margin:0 0 20px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start}
.side{position:sticky;top:64px}
.card{background:var(--surface);border:1px solid var(--n200);border-radius:12px;padding:18px}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--n500);font-size:13px}
.h2{font-size:19px;font-weight:700;margin:0}
.h3{font-size:16px;font-weight:600;margin:0}
.btn{height:48px;border-radius:10px;border:0;background:var(--primary-700);color:var(--btn-text);font-weight:600;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 20px}
.btn:hover{filter:brightness(1.07)}
.btn.sec{background:var(--primary-50);color:var(--primary-700)}
.btn.ghost{background:none;border:1px solid var(--n300);color:var(--n700)}
.btn.sm{height:38px;width:auto;padding:0 16px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:500}
.input{height:48px;border:1px solid var(--n300);border-radius:8px;background:var(--surface);padding:0 14px;width:100%}
.input:focus{border-color:var(--primary-600);outline:2px solid var(--primary-100)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--n100);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:8px;height:40px;color:var(--n500);font-weight:500}
.seg button.on{background:var(--surface);color:var(--primary-700);box-shadow:0 1px 2px rgba(15,23,42,.12);font-weight:600}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:3px 11px;border-radius:99px}
.badge i{width:6px;height:6px;border-radius:50%;background:currentColor}
.b-ok{background:var(--ok-50);color:var(--ok-700)}.b-warn{background:var(--warn-50);color:var(--warn-700)}
.b-info{background:var(--primary-50);color:var(--primary-700)}.b-bad{background:var(--bad-50);color:var(--bad-700)}.b-gray{background:var(--n100);color:var(--n700)}
.hero{background:linear-gradient(120deg,var(--hero-a),var(--hero-b));color:#fff;border-radius:16px;padding:44px 40px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;align-items:center;margin-bottom:32px}
.hero h1{margin:0 0 10px;font-size:34px;line-height:1.35}
.hero p{margin:0 0 20px;opacity:.93;max-width:46ch}
.hero .btn{background:#fff;color:#0369a1;width:auto;display:inline-flex}
.hero .art{display:grid;place-items:center;opacity:.95}
.hero .art svg{width:170px;height:170px}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin:28px 0 14px}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.cat{background:var(--surface);border:1px solid var(--n200);border-radius:12px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600;color:var(--n900)}
.cat:hover{border-color:var(--primary-600)}
.cat span{color:var(--primary-700)}
.cat svg{width:30px;height:30px}
.info3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:32px}
.info3 .card{display:flex;gap:12px;align-items:flex-start}
.info3 svg{width:28px;height:28px;color:var(--primary-700);flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.prod{display:flex;flex-direction:column;gap:10px;text-align:start;background:var(--surface);border:1px solid var(--n200);border-radius:12px;padding:12px}
.prod:hover{border-color:var(--primary-600)}
.prod .img,.big{border-radius:8px;background:var(--primary-50);display:grid;place-items:center;color:var(--primary-700)}
.prod .img{height:140px}.prod .img svg{width:60px;height:60px}
.big{height:360px}.big svg{width:140px;height:140px}
.prod b{font-weight:600;line-height:1.5}
.price{font-weight:700;font-variant-numeric:tabular-nums}
.price small{font-weight:400;color:var(--n500);font-size:12px}
.tools{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.tools .input{max-width:340px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{border:1px solid var(--n300);background:var(--surface);border-radius:99px;padding:6px 16px;font-size:14px;color:var(--n700)}
.chips button.on{background:var(--primary-700);border-color:var(--primary-700);color:var(--btn-text)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--n300);border-radius:8px;overflow:hidden}
.qty button{width:34px;height:34px;border:0;background:var(--n100);font-size:18px}
.qty span{min-width:36px;text-align:center;font-variant-numeric:tabular-nums}
.line{flex-wrap:wrap;display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--n200)}
.line:last-child{border-bottom:0}
.thumb{width:72px;height:72px;border-radius:8px;background:var(--primary-50);display:grid;place-items:center;color:var(--primary-700);flex:none}
.thumb svg{width:34px;height:34px}
.sum div{display:flex;justify-content:space-between;padding:6px 0;font-variant-numeric:tabular-nums;gap:10px}
.sum .tot{border-top:1px dashed var(--n300);margin-top:8px;padding-top:12px;font-weight:700;font-size:18px}
.alert{border-radius:10px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.alert svg{flex:none;width:20px;height:20px}
.alert.info{background:var(--primary-50);color:var(--primary-700)}.alert.warn{background:var(--warn-50);color:var(--warn-700)}.alert.ok{background:var(--ok-50);color:var(--ok-700)}
.timeline{display:flex;flex-direction:column}
.tl{display:flex;gap:14px;position:relative;padding-bottom:22px}
.tl:last-child{padding-bottom:0}
.tl::before{content:"";position:absolute;inset-inline-start:13px;top:28px;bottom:0;width:2px;background:var(--n200)}
.tl:last-child::before{display:none}
.tl .c{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--n100);color:var(--n400);border:2px solid var(--n200);font-size:13px}
.tl.done .c{background:var(--ok-500);border-color:var(--ok-500);color:#fff}
.tl.done::before{background:var(--ok-500)}
.tl.now .c{background:var(--primary-600);border-color:var(--primary-600);color:#fff}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.days button{border:1px solid var(--n300);background:var(--surface);border-radius:10px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.days button.on{border-color:var(--primary-600);background:var(--primary-50);color:var(--primary-700);font-weight:600}
.days button[disabled]{opacity:.4;cursor:not-allowed}
.days small{color:var(--n500);font-size:12px}
.opt{display:flex;gap:12px;align-items:center;border:1px solid var(--n300);border-radius:10px;padding:14px;background:var(--surface);width:100%;text-align:start}
.opt.on{border-color:var(--primary-600);background:var(--primary-50)}
.opt .r{width:20px;height:20px;border-radius:50%;border:2px solid var(--n300);flex:none}
.opt.on .r{border:6px solid var(--primary-600)}
.opt[disabled]{opacity:.5;cursor:not-allowed}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:grid;place-items:center;z-index:40;padding:16px}
.modal>div{background:var(--surface);width:100%;max-width:420px;border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:16px}
.otp{display:flex;gap:10px;direction:ltr;justify-content:center}
.otp input{width:56px;height:60px;text-align:center;font-size:24px;border:1px solid var(--n300);border-radius:10px;background:var(--surface)}
.check{width:72px;height:72px;border-radius:50%;background:var(--ok-50);color:var(--ok-700);display:grid;place-items:center;margin:0 auto}
.check svg{width:36px;height:36px}
.center{text-align:center}
.narrow{max-width:680px;margin-inline:auto}
.empty{display:flex;flex-direction:column;align-items:center;gap:12px;padding:60px 10px;color:var(--n500);text-align:center}
.toast{position:fixed;bottom:24px;inset-inline:0;margin-inline:auto;width:max-content;max-width:90vw;background:var(--n900);color:var(--n50);padding:12px 18px;border-radius:10px;z-index:60}
:root[data-theme="dark"] .toast{background:#e2e8f0;color:#0f172a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .toast{background:#e2e8f0;color:#0f172a}}
footer{border-top:1px solid var(--n200);background:var(--surface);padding-block:24px;color:var(--n500);font-size:13px}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
/* drawer */
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:360px;max-width:92vw;background:var(--surface);border-inline-start:1px solid var(--n200);z-index:30;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:-8px 0 30px rgba(15,23,42,.15)}
.drawer h2{font-size:15px;margin:0 0 8px;font-weight:600}
.drawer ul{margin:0;padding-inline-start:18px;color:var(--n700);font-size:14px}
.drawer li{margin-bottom:6px}
.tag{font-size:12px;color:var(--primary-700);background:var(--primary-50);padding:2px 10px;border-radius:99px;display:inline-block;margin-bottom:8px}
.sys{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.sys span{font-size:12px;border:1px dashed var(--n300);color:var(--n500);padding:2px 9px;border-radius:6px}
.steps{display:flex;flex-direction:column;gap:2px}
.steps button{text-align:start;background:none;border:0;padding:8px 10px;border-radius:8px;color:var(--n700);font-size:14px;display:flex;gap:8px;align-items:center}
.steps button:hover{background:var(--n100)}
.steps button.on{background:var(--primary-50);color:var(--primary-700);font-weight:600}
.steps i{width:6px;height:6px;border-radius:50%;background:var(--n300);flex:none}
.steps button.on i{background:var(--primary-600)}
@media (max-width:900px){
  .cols{grid-template-columns:1fr}.side{position:static}
  .hero{grid-template-columns:1fr;padding:28px 22px}.hero .art{display:none}.hero h1{font-size:26px}
  .big{height:240px}.two{grid-template-columns:1fr}
  .nav{order:3;flex-basis:100%}
}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}

.citysw{max-width:340px;margin-bottom:14px;background:rgba(255,255,255,.18)}.citysw button{color:#fff!important;display:inline-flex;align-items:center;justify-content:center;gap:6px}.citysw button.on{background:#fff!important;color:#0369a1!important}
.hero .btn.ghostw{background:transparent;border:1.5px solid #fff;color:#fff}
.trust{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:16px}.trust div{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--n200);border-radius:12px;padding:12px 14px;font-weight:600;font-size:14px}.trust svg{width:22px;height:22px;color:var(--primary-700);flex:none}
.bundle{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:center;margin-top:28px;background:var(--primary-50);border:1px solid var(--primary-100);border-radius:16px;padding:28px}.bundle .art{display:grid;place-items:center;color:var(--primary-700)}.bundle .art svg{width:110px;height:110px}
.steps4{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.steps4 .card{display:flex;flex-direction:column;gap:4px}.steps4 .num{width:30px;height:30px;border-radius:50%;background:var(--primary-600);color:var(--btn-text);display:grid;place-items:center;font-weight:700;margin-bottom:6px}
.svc2{gap:14px}.svc2 svg{width:28px;height:28px;color:var(--primary-700)}.urgent{border-color:var(--bad-700)}
.stars{color:#b45309;letter-spacing:2px}
.faq{padding:0}.fq{border-bottom:1px solid var(--n200)}.fq:last-child{border-bottom:0}.fq button{width:100%;display:flex;justify-content:space-between;gap:12px;padding:16px 18px;border:0;background:none;font:inherit;font-weight:600;color:var(--n900);text-align:start}.fq p{margin:0;padding:0 18px 16px;color:var(--n500)}
.cta{margin-top:32px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;background:linear-gradient(120deg,var(--hero-a),var(--hero-b));color:#fff;border-radius:16px;padding:26px 28px}.cta .btn{background:#fff;color:#0369a1;width:auto}
.ft{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:24px;padding-bottom:18px}.ft h4{margin:0 0 8px;font-size:14px;color:var(--n900)}.ft button{display:block;border:0;background:none;padding:4px 0;color:var(--n500);font:inherit;text-align:start}.ft button:hover{color:var(--primary-700)}.ft .bot{grid-column:1/-1;border-top:1px solid var(--n200);padding-top:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

</style>

function totals(){
 const sub=cartItems().reduce((a,i)=>a+i.price*i.qty,0);
 const inst=withInstall()?FEES.install:0;
 const ship=inMk()?0:FEES.ship;
 const base=sub+inst+ship, vat=Math.round(base*FEES.vat*100)/100;
 return {sub,inst,ship,vat,total:base+vat};
}
function go(s,extra){Object.assign(S,extra||{});if(['address','review','pay'].includes(s)&&!S.cart.length)s='cart';if(s==='service'&&!extra)S.svcDone=null;S.screen=s;S.sheet=null;render();window.scrollTo(0,0)}
function toast(m){S.toast=m;render();setTimeout(()=>{S.toast='';render()},1900)}
function addCart(id){const c=S.cart.find(x=>x.id===id);c?c.qty++:S.cart.push({id,qty:1});toast('أضيف إلى السلة')}
function finishSvc(k){if(k==='emergency'){S.emg={step:0,accept:null,pay:null};go('emergency')}else{S.svcDone=k;render();window.scrollTo(0,0)}}
function needLogin(next){if(S.user){next.startsWith('svc:')?finishSvc(next.slice(4)):go(next)}else{S.sheet={step:1,next};render()}}

 if(d.resend){S.sheet.step=1;render();return}
