<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<title>لوحة مدير غيث</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: admin console. Right sidebar (RTL) + top bar + work area; tables and a step-by-step work-order panel. Review bar and drawer carry reviewer notes. Tokens from Design System Foundations. */
:root{
  --primary-50:#f0f9ff;--primary-100:#e0f2fe;--primary-500:#38bdf8;--primary-600:#0ea5e9;--primary-700:#0369a1;
  --n50:#f8fafc;--n100:#f1f5f9;--n200:#e2e8f0;--n300:#cbd5e1;--n400:#94a3b8;--n500:#566377;--n700:#334155;--n900:#0f172a;
  --surface:#ffffff;
  --ok-50:#f0fdf4;--ok-500:#22c55e;--ok-700:#15803d;
  --warn-50:#fffbeb;--warn-500:#f59e0b;--warn-700:#b45309;
  --bad-50:#fef2f2;--bad-500:#ef4444;--bad-700:#b91c1c;
  --pur-50:#faf5ff;--pur-700:#7e22ce;--org-50:#fff7ed;--org-700:#c2410c;
  --btn-text:#ffffff;
  --font:"IBM Plex Sans Arabic","Tajawal",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --primary-50:#0b2a3d;--primary-100:#0c3a55;--primary-700:#7dd3fc;--primary-600:#38bdf8;
  --n50:#0b1220;--n100:#1e293b;--n200:#334155;--n300:#475569;--n400:#94a3b8;--n500:#a3b1c4;--n700:#cbd5e1;--n900:#f1f5f9;
  --surface:#131c2e;--ok-50:#0e2a1a;--ok-700:#4ade80;--warn-50:#2e2208;--warn-700:#fbbf24;--bad-50:#321416;--bad-700:#f87171;
  --pur-50:#241437;--pur-700:#d8b4fe;--org-50:#2e1a0a;--org-700:#fdba74;--btn-text:#06202f;color-scheme:dark}}
:root[data-theme="dark"]{
  --primary-50:#0b2a3d;--primary-100:#0c3a55;--primary-700:#7dd3fc;--primary-600:#38bdf8;
  --n50:#0b1220;--n100:#1e293b;--n200:#334155;--n300:#475569;--n400:#94a3b8;--n500:#a3b1c4;--n700:#cbd5e1;--n900:#f1f5f9;
  --surface:#131c2e;--ok-50:#0e2a1a;--ok-700:#4ade80;--warn-50:#2e2208;--warn-700:#fbbf24;--bad-50:#321416;--bad-700:#f87171;
  --pur-50:#241437;--pur-700:#d8b4fe;--org-50:#2e1a0a;--org-700:#fdba74;--btn-text:#06202f;color-scheme:dark}
*{box-sizing:border-box}
.grid2>*,.kpis>*{min-width:0}
[hidden]{display:none!important}
body{background:var(--n50);color:var(--n900);font-family:var(--font);direction:rtl;font-size:14px;line-height:1.65;padding:0}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary-600);outline-offset:2px}
.review{background:var(--n900);color:var(--n50);font-size:13px;position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
:root[data-theme="dark"] .review{background:#020617;color:#e2e8f0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .review{background:#020617;color:#e2e8f0}}
.review .in{display:flex;align-items:center;gap:12px;min-height:42px;flex-wrap:wrap;padding:6px 16px}
.review button{background:rgba(148,163,184,.22);border:0;color:inherit;border-radius:8px;padding:5px 12px;font-size:12px}
.pill{background:var(--primary-600);color:#06202f;border-radius:99px;padding:1px 10px;font-size:11px;font-weight:600}
.sp{flex:1}
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 42px)}
.side{background:var(--surface);border-inline-end:1px solid var(--n200);padding:16px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:42px;align-self:start;height:calc(100vh - 42px);overflow-y:auto}
.brand{display:flex;gap:8px;align-items:center;font-weight:700;font-size:20px;color:var(--primary-700);padding:4px 10px 14px}
.brand svg{width:26px;height:26px}
.side button.nv{display:flex;align-items:center;gap:10px;padding:10px 12px;border:0;background:none;border-radius:8px;color:var(--n700);text-align:start;font-weight:500;width:100%}
.side button.nv:hover{background:var(--n100)}
.side button.nv.on{background:var(--primary-50);color:var(--primary-700);font-weight:600}
.side button.nv svg{width:18px;height:18px;flex:none}
.side button.nv .cnt{margin-inline-start:auto;background:var(--bad-500);color:#fff;border-radius:99px;font-size:11px;min-width:20px;text-align:center;padding:0 6px}
.side .who{margin-top:auto;border-top:1px solid var(--n200);padding:12px 8px 0;font-size:13px}
.side .who span{color:var(--n500);display:block;font-size:12px}
.work{padding:24px;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{font-size:22px;margin:0;font-weight:700}

.card{background:var(--surface);border:1px solid var(--n200);border-radius:12px;padding:16px}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrapr{flex-wrap:wrap}

.h3{font-size:15px;font-weight:600;margin:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--n200);border-radius:12px;padding:14px;text-align:start;display:flex;flex-direction:column;gap:2px}

.kpi span{color:var(--n500);font-size:13px}
.kpi.warn b{color:var(--warn-700)}.kpi.bad b{color:var(--bad-700)}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:start;color:var(--n500);font-weight:500;font-size:12px;padding:10px 12px;border-bottom:1px solid var(--n200);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--n100);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.clk{cursor:pointer}
tbody tr.clk:hover{background:var(--n100)}
td b{font-weight:600}
.num{font-variant-numeric:tabular-nums}

.badge i{width:6px;height:6px;border-radius:50%;background:currentColor}
.b-ok{background:var(--ok-50);color:var(--ok-700)}.b-warn{background:var(--warn-50);color:var(--warn-700)}
.b-info{background:var(--primary-50);color:var(--primary-700)}.b-bad{background:var(--bad-50);color:var(--bad-700)}.b-gray{background:var(--n100);color:var(--n700)}
.b-pur{background:var(--pur-50);color:var(--pur-700)}.b-org{background:var(--org-50);color:var(--org-700)}
.btn{height:38px;border-radius:8px;border:0;background:var(--primary-700);color:var(--btn-text);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 16px;white-space:nowrap}
.btn:hover{filter:brightness(1.07)}
.btn.sec{background:var(--primary-50);color:var(--primary-700)}
.btn.ghost{background:none;border:1px solid var(--n300);color:var(--n700)}
.btn.danger{background:var(--bad-50);color:var(--bad-700)}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.input,.sel{height:38px;border:1px solid var(--n300);border-radius:8px;background:var(--surface);padding:0 12px;width:100%}
textarea.input{height:auto;padding:10px 12px}
.input:focus,.sel:focus{border-color:var(--primary-600);outline:2px solid var(--primary-100)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:500}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--n200);margin-bottom:14px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 14px;color:var(--n500);font-weight:500;white-space:nowrap}
.tabs button.on{color:var(--primary-700);border-color:var(--primary-600);font-weight:600}
.alert{border-radius:10px;padding:10px 12px;font-size:13.5px;display:flex;gap:8px;align-items:flex-start}
.alert.info{background:var(--primary-50);color:var(--primary-700)}.alert.warn{background:var(--warn-50);color:var(--warn-700)}.alert.ok{background:var(--ok-50);color:var(--ok-700)}.alert.bad{background:var(--bad-50);color:var(--bad-700)}
.list{display:flex;flex-direction:column}
.list>div{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--n100)}
.list>div:last-child{border-bottom:0}
.stepper{display:flex;flex-direction:column}
.sp1{display:flex;gap:12px;position:relative;padding-bottom:14px}
.sp1:last-child{padding-bottom:0}
.sp1::before{content:"";position:absolute;inset-inline-start:11px;top:26px;bottom:0;width:2px;background:var(--n200)}
.sp1:last-child::before{display:none}
.sp1 .c{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--n100);color:var(--n400);border:2px solid var(--n200);font-size:12px}
.sp1.done .c{background:var(--ok-500);border-color:var(--ok-500);color:#fff}
.sp1.done::before{background:var(--ok-500)}
.sp1.now .c{background:var(--primary-600);border-color:var(--primary-600);color:#fff}
.sp1.skip{opacity:.5}
.sp1 b{font-weight:600}
.opt{display:flex;gap:10px;align-items:center;border:1px solid var(--n300);border-radius:8px;padding:10px 12px;background:var(--surface);width:100%;text-align:start}
.opt.on{border-color:var(--primary-600);background:var(--primary-50)}
.opt .r{width:16px;height:16px;border-radius:50%;border:2px solid var(--n300);flex:none}
.opt.on .r{border:5px solid var(--primary-600)}
.opt[disabled]{opacity:.5;cursor:not-allowed}
.msg{background:var(--n100);border-radius:10px;padding:12px;font-size:13.5px;white-space:pre-line;border:1px dashed var(--n300)}
.sum div{display:flex;justify-content:space-between;padding:4px 0;font-variant-numeric:tabular-nums;gap:10px}
.sum .tot{border-top:1px dashed var(--n300);margin-top:6px;padding-top:8px;font-weight:700;font-size:15px}
.toast{position:fixed;bottom:22px;inset-inline:0;margin-inline:auto;width:max-content;max-width:90vw;background:var(--n900);color:var(--n50);padding:10px 16px;border-radius:10px;z-index:60}
:root[data-theme="dark"] .toast{background:#e2e8f0;color:#0f172a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .toast{background:#e2e8f0;color:#0f172a}}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:grid;place-items:center;z-index:50;padding:16px}
.modal>div{background:var(--surface);width:100%;max-width:440px;border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:360px;max-width:92vw;background:var(--surface);border-inline-start:1px solid var(--n200);z-index:40;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:-8px 0 30px rgba(15,23,42,.15)}
.drawer h2{font-size:15px;margin:0 0 8px;font-weight:600}
.drawer ul{margin:0;padding-inline-start:18px;color:var(--n700)}
.drawer li{margin-bottom:6px}
.tag{font-size:12px;color:var(--primary-700);background:var(--primary-50);padding:2px 10px;border-radius:99px;display:inline-block;margin-bottom:8px}
.sys{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.sys span{font-size:12px;border:1px dashed var(--n300);color:var(--n500);padding:2px 9px;border-radius:6px}
.steps{display:flex;flex-direction:column;gap:2px}
.steps button{text-align:start;background:none;border:0;padding:7px 10px;border-radius:8px;color:var(--n700);display:flex;gap:8px;align-items:center}
.steps button:hover{background:var(--n100)}
.steps button.on{background:var(--primary-50);color:var(--primary-700);font-weight:600}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:8px;border-inline-end:0;border-bottom:1px solid var(--n200)}
  .side .brand,.side .who{display:none}
  .side button.nv{width:auto;white-space:nowrap}
  .grid2{grid-template-columns:1fr}
  .work{padding:16px}
}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--n100);border-radius:10px;padding:3px;gap:3px}.seg button{border:0;background:none;border-radius:8px;height:36px;color:var(--n500);font-weight:500}.seg button.on{background:var(--surface);color:var(--primary-700);box-shadow:0 1px 2px rgba(15,23,42,.12);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.two>*{min-width:0}
.badge.xs{font-size:11px;padding:1px 8px}
.items{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto}
.it{display:flex;gap:8px;align-items:center;border:1px solid var(--n300);border-radius:8px;padding:6px 8px;background:var(--surface)}
.it.on{border-color:var(--primary-600);background:var(--primary-50)}
.it .tg{flex:1;min-width:0;display:flex;gap:8px;align-items:center;background:none;border:0;text-align:start;padding:4px 2px;flex-wrap:wrap}
.it .ck{width:18px;height:18px;border-radius:5px;border:2px solid var(--n300);display:grid;place-items:center;flex:none;color:#fff}
.it.on .ck{background:var(--primary-600);border-color:var(--primary-600)}
.it .nm{font-weight:600}
.it .pr{margin-inline-start:auto;font-weight:600}
.qty{display:inline-flex;align-items:center;border:1px solid var(--n300);border-radius:8px;overflow:hidden;flex:none}
.qty button{width:30px;height:30px;border:0;background:var(--n100);font-size:16px}
.qty span{min-width:30px;text-align:center;font-variant-numeric:tabular-nums}
.mx>div{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--n100)}
.mx>div:last-child{border-bottom:0}
.tmodal{max-width:400px!important;max-height:92vh;overflow-y:auto;background:var(--n100)!important}
.tphone{display:flex;flex-direction:column;gap:12px;background:var(--n50);border-radius:14px;padding:12px}
.tp-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tp-c,.tp-s{background:var(--surface);border:1px solid var(--n200);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.gl{stroke:var(--n200);stroke-width:1}
.ax{fill:var(--n500);font-size:11px;font-family:var(--font)}
.vl{fill:var(--n700);font-size:11px;font-weight:600;font-family:var(--font)}
.bar{fill:var(--primary-600)}
table.pm td,table.pm th{text-align:center}table.pm td:first-child,table.pm th:first-child{text-align:start}
.chk,.sw{position:relative;display:inline-block;cursor:pointer}
.chk input,.sw input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.chk span{display:block;width:20px;height:20px;border-radius:5px;border:2px solid var(--n300);background:var(--surface)}
.chk input:checked+span{background:var(--primary-600);border-color:var(--primary-600);box-shadow:inset 0 0 0 3px var(--surface)}
.chk input:disabled+span{opacity:.5}
.chk input:focus-visible+span,.sw input:focus-visible+span{outline:2px solid var(--primary-600);outline-offset:2px}
.sw{width:40px;height:22px}
.sw span{position:absolute;inset:0;border-radius:99px;background:var(--n300);transition:background .15s}
.sw span::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked+span{background:var(--primary-600)}
.sw input:checked+span::after{transform:translateX(-18px)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--primary-50);color:var(--primary-700);border-radius:99px;padding:3px 6px 3px 12px;font-size:13px}
.chip button{border:0;background:none;color:inherit;font-size:16px;line-height:1;padding:0 4px}
.dbtn{border:1px solid var(--n300);background:var(--surface);border-radius:99px;padding:5px 14px;color:var(--n500)}
.dbtn.on{background:var(--primary-700);border-color:var(--primary-700);color:var(--btn-text)}
.cards3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.cards3>*{min-width:0}
.badge.xs{font-size:11px;padding:1px 8px}
@media (prefers-reduced-motion:reduce){.sw span,.sw span::after{transition:none}}
</style>

<div class="review" id="review"></div>
<div class="shell"><nav class="side" id="side"></nav><main class="work" id="work"></main></div>
<aside class="drawer" id="drawer" hidden></aside>
<div id="overlay"></div>

<script>
const ICON={
 dash:'<path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 9h8V3h-8z"/>',
 check:'<path d="M5 12l5 5 9-10"/>',
 users:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.5 3-5.5 7-5.5s7 2 7 5.5M17 4.5a3.5 3.5 0 0 1 0 7M19 15c2 .7 3 2.2 3 5"/>',
 key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/>',
 box:'<path d="M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10"/>',
 chart:'<path d="M4 20V4M4 20h16M8 16v-5M12 16V8M16 16v-3"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',
 plug:'<path d="M9 2v6M15 2v6M6 8h12v4a6 6 0 0 1-12 0zM12 18v4"/>',
 log:'<path d="M5 3h14v18H5zM9 8h6M9 12h6M9 16h4"/>',
 drop:'<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 bell:'<path d="M6 17V11a6 6 0 0 1 12 0v6l2 2H4zM10 21h4"/>'
};
const ic=(n,s)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" ${s?`style="width:${s}px;height:${s}px"`:''}>${ICON[n]}</svg>`;
const fmt=n=>n.toLocaleString('en-US',{maximumFractionDigits:2});
const BADGE={'ناجح':'b-ok','فاشل':'b-bad','معلّق':'b-warn','نشط':'b-ok','معطل':'b-gray','منشور':'b-ok','مسودة':'b-gray','بانتظار القرار':'b-warn','معتمد':'b-ok','مرفوض':'b-bad','متصل':'b-ok','غير مفعل':'b-gray','تحت الحد':'b-bad'};
const bd=(t,label)=>`<span class="badge ${BADGE[t]||'b-gray'}"><i></i>${label||t}</span>`;
const opts=(arr,sel,blank)=>(blank?`<option value="">${blank}</option>`:'')+arr.map(x=>`<option ${x===sel?'selected':''}>${x}</option>`).join('');

const PAGES_RBAC=['لوحة الإدارة','الطلبات والمتجر','المواعيد والبلاغات','أوامر العمل','العملاء والأجهزة','المدفوعات والعهد','المخزون','المنتجات والكتالوج','التقارير','المستخدمون والأدوار','الإعدادات والتكاملات','سجل التدقيق'];
const mk=(v,a,e,p)=>({v,a,e,p});
const allp=on=>PAGES_RBAC.map(()=>mk(on,on,on,on));
const ROLES={
 'مدير النظام':allp(true),
 'موظف عمليات':[mk(1,0,0,0),mk(1,1,1,0),mk(1,1,1,0),mk(1,1,1,0),mk(1,1,1,0),mk(1,1,1,0),mk(1,1,1,0),mk(1,0,0,0),mk(1,0,0,0),mk(0,0,0,0),mk(0,0,0,0),mk(0,0,0,0)],

function bars(vals,labels,max,unit){
 const W=560,H=230,L=48,B=30,T=14,R=10,n=vals.length,cw=(W-L-R)/n,bw=Math.min(46,cw*.55);
 const ticks=[0,1,2,3,4].map(i=>Math.round(max*i/4));
 const y=v=>T+(H-T-B)*(1-v/max);
 return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${unit||'رسم بياني'}: ${labels.map((l,i)=>l+' '+fmt(vals[i])).join('، ')}" style="width:100%;height:auto;display:block"><title>${unit||'رسم بياني'}</title>
 ${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" class="gl"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end" class="ax" direction="ltr" style="unicode-bidi:plaintext">${fmt(t)}</text>`).join('')}
 ${vals.map((v,i)=>{const x=L+cw*i+(cw-bw)/2;return `<rect x="${x}" y="${y(v)}" width="${bw}" height="${H-B-y(v)}" rx="4" class="bar"/><text x="${x+bw/2}" y="${y(v)-5}" text-anchor="middle" class="vl">${fmt(v)}</text><text x="${x+bw/2}" y="${H-10}" text-anchor="middle" class="ax">${labels[i]}</text>`}).join('')}
 </svg><div class="muted">${unit||''}</div>`;
}

document.addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(d.drawer){S.drawer=!S.drawer;render();return}
 if(d.go){go(d.go);return}
 if(d.modal){S.modal=d.modal;render();return}
 if(d.mclose){S.modal=null;render();return}
 if(d.mok){const[k,id]=d.mok.split(':');mok(k,id);return}
 if(d.ap){const[k,id]=d.ap.split(':');const a=S.appr.find(x=>x.id===id);a.st='معتمد';audit('اعتمد '+a.kind+' '+id,'موافقات');toast('تم الاعتماد');return}
 if(d.utog){const u=S.users.find(x=>x.id==d.utog);u.active=!u.active;audit((u.active?'فعّل':'عطّل')+' حساب '+u.name,'مستخدمون');toast(u.active?'تم تفعيل الحساب':'تم تعطيل الحساب');return}
 if(d.ureset){const u=S.users.find(x=>x.id==d.ureset);audit('أعاد تعيين دخول '+u.name,'مستخدمون');toast('أُرسل رابط إعادة التعيين إلى '+u.name);return}
 if(d.role){S.role=d.role;render();return}
 if(d.ptab){S.prodTab=d.ptab;render();return}
 if(d.period){S.period=d.period;render();return}
 if(d.rtab){S.repTab=d.rtab;render();return}
 if(d.day){S.set.days[d.day]=S.set.days[d.day]?0:1;render();return}
 if(d.deldist){S.set.districts.splice(+d.deldist,1);render();return}
 if(d.adddist){const v=document.getElementById('newdist').value.trim();if(!v){toast('اكتب اسم الحي');return}S.set.districts.push(v);render();return}

 if(d.itest){toast(S.integ[d.itest].on?'نجح الاتصال':'فعّل التكامل أولًا');return}
 if(d.retry){const l=S.ilog.find(x=>x.id===d.retry);l.st='ناجح';delete l.err;audit('أعاد محاولة '+l.id+' ('+l.sys+')','تكاملات');toast('نجحت إعادة المحاولة');return}

function mok(k,id){
 if(k==='adduser'){const n=document.getElementById('au_name').value.trim(),p=document.getElementById('au_phone').value.trim();if(!n||p.length<9){toast('الاسم ورقم الجوال مطلوبان');return}S.users.push({id:Date.now(),name:n,phone:p,role:document.getElementById('au_role').value,active:true,last:'لم يدخل بعد'});audit('أضاف المستخدم '+n,'مستخدمون');S.modal=null;toast('أُضيف المستخدم وأُرسلت دعوة التفعيل')}
 else if(k==='addrole'){const n=document.getElementById('ar_name').value.trim();if(!n||ROLES[n]){toast('اكتب اسمًا جديدًا للدور');return}ROLES[n]=ROLES[document.getElementById('ar_copy').value].map(o=>({...o}));S.role=n;audit('أنشأ الدور '+n,'صلاحيات');S.modal=null;toast('أُنشئ الدور، عدّل صلاحياته')}
 else if(k==='addprod'){const n=document.getElementById('ap_name').value.trim(),p=+document.getElementById('ap_price').value;if(!n||!(p>0)){toast('الاسم والسعر مطلوبان');return}S.products.push({id:Date.now(),name:n,type:document.getElementById('ap_type').value,price:p,pub:false});audit('أضاف المنتج '+n+' كمسودة','منتجات');S.modal=null;toast('حُفظ كمسودة')}
 else if(k==='price'){const v=+document.getElementById('pp').value;if(!(v>0)){toast('أدخل سعرًا صحيحًا');return}const p=S.products.find(x=>x.id==id);audit('غيّر سعر '+p.name+' من '+fmt(p.price)+' إلى '+fmt(v),'منتجات');p.price=v;S.modal=null;toast('حُدّث السعر')}
 else if(k==='reject'){const r=document.getElementById('rj').value.trim();if(!r){toast('اكتب سبب الرفض');return}const a=S.appr.find(x=>x.id===id);a.st='مرفوض';audit('رفض '+a.kind+' '+id+': '+r,'موافقات');S.modal=null;toast('تم الرفض وحُفظ السبب')}
 render();
}

const _oldCompatBundles=V.catalog;
V.catalog=()=>{
 const f=S.pfil,tab=S.prodTab;
 const tabs=[['products','المنتجات'],['cats','التصنيفات'],['brands','الشركات'],['compat','توافق الفلاتر والعمر'],['bundles','الباقات']];
 const head=`<div class="ph"><div><h1>المنتجات والكتالوج</h1><p>ما يظهر في المتجر وكيف تُحسب مواعيد الصيانة</p></div>${tab==='products'?`<button class="btn" data-newprod="1">${ic('plus',16)} إضافة منتج</button>`:tab==='cats'?`<button class="btn" data-modal="addcat:0">${ic('plus',16)} تصنيف جديد</button>`:tab==='brands'?`<button class="btn" data-modal="addbrand:0">${ic('plus',16)} شركة جديدة</button>`:''}</div>

 }
 if(tab==='cats'){
  const row=(c,lvl)=>`<tr><td style="padding-inline-start:${12+lvl*26}px">${lvl?'<span class="muted">└ </span>':''}<b>${c.name}</b></td><td class="num">${catCount(c.id)}</td><td><label class="sw"><input type="checkbox" data-cvis="${c.id}" ${c.vis?'checked':''} aria-label="إظهار ${c.name}"><span></span></label></td><td><div class="row">${lvl?'':`<button class="btn sm sec" data-modal="addcat:${c.id}">+ فرعي</button>`}<button class="btn sm ghost" data-modal="editcat:${c.id}">تعديل</button><button class="btn sm ghost" data-delcat="${c.id}" style="color:var(--bad-700)">حذف</button></div></td></tr>`;
  return head+`<div class="card tw"><table><thead><tr><th>التصنيف</th><th>عدد المنتجات</th><th>ظاهر في المتجر</th><th></th></tr></thead><tbody>${S.cats.filter(c=>!c.parent).map(c=>row(c,0)+kids(c.id).map(k=>row(k,1)).join('')).join('')}</tbody></table></div><p class="muted" style="margin-top:8px">لا يُحذف تصنيف فيه منتجات أو تصنيفات فرعية. انقل المنتجات أولًا.</p>`;
 }
 if(tab==='brands'){
  return head+`<div class="card tw"><table><thead><tr><th>الشركة</th><th>بلد المنشأ</th><th>عدد المنتجات</th><th></th></tr></thead><tbody>${S.brands.map(b=>`<tr><td><b>${b.name}</b></td><td>${b.country||'-'}</td><td class="num">${S.products.filter(p=>p.brand==b.id).length}</td><td><button class="btn sm ghost" data-delbrand="${b.id}" style="color:var(--bad-700)">حذف</button></td></tr>`).join('')}</tbody></table></div>`;
 }
 const old=_oldCompatBundles();const i=old.indexOf('<div class="tabs">');const j=old.indexOf('</div>',old.indexOf('data-ptab="bundles"'))+6;
 return head+old.slice(j);
};

const _mh=modalHtml;
modalHtml=function(){
 const m=S.modal;if(!m)return '';const [k,id]=m.split(':');let b='';
 if(k==='addcat'){const par=+id;b=`<h3 class="h3">${par?'تصنيف فرعي جديد':'تصنيف جديد'}</h3><div class="field"><label for="ac_name">اسم التصنيف</label><input class="input" id="ac_name"></div><div class="field"><label for="ac_parent">التصنيف الأب</label><select class="sel" id="ac_parent"><option value="0">بدون (تصنيف رئيسي)</option>${S.cats.filter(c=>!c.parent).map(c=>`<option value="${c.id}" ${par==c.id?'selected':''}>${c.name}</option>`).join('')}</select></div><div class="row"><button class="btn" data-mok="addcat:0">إضافة</button><button class="btn ghost" data-mclose="1">إلغاء</button></div>`}
 else if(k==='editcat'){const c=S.cats.find(x=>x.id==id);b=`<h3 class="h3">تعديل التصنيف</h3><div class="field"><label for="ec_name">الاسم</label><input class="input" id="ec_name" value="${c.name}"></div><div class="row"><button class="btn" data-mok="editcat:${id}">حفظ</button><button class="btn ghost" data-mclose="1">إلغاء</button></div>`}
 else if(k==='addbrand'){b=`<h3 class="h3">شركة مصنعة جديدة</h3><div class="field"><label for="ab_name">اسم الشركة</label><input class="input" id="ab_name"></div><div class="field"><label for="ab_country">بلد المنشأ</label><input class="input" id="ab_country"></div><div class="row"><button class="btn" data-mok="addbrand:0">إضافة</button><button class="btn ghost" data-mclose="1">إلغاء</button></div>`}
 else return _mh();
 return `<div class="modal" role="dialog" aria-modal="true"><div>${b}</div></div>`;
};
const _mok=mok;
mok=function(k,id){
 if(k==='addcat'){const n=document.getElementById('ac_name').value.trim(),par=+document.getElementById('ac_parent').value;if(!n){toast('اكتب اسم التصنيف');return}if(S.cats.some(c=>c.name===n&&c.parent===par)){toast('التصنيف موجود مسبقًا');return}const nid=Date.now();S.cats.push({id:nid,name:n,parent:par,vis:true});if(S.page==='prodform')S.pf.cat=nid;audit('أضاف التصنيف '+n,'منتجات');S.modal=null;toast('أُضيف التصنيف');return}
 if(k==='editcat'){const n=document.getElementById('ec_name').value.trim();if(!n){toast('اكتب الاسم');return}const c=S.cats.find(x=>x.id==id);audit('أعاد تسمية التصنيف '+c.name+' إلى '+n,'منتجات');c.name=n;S.modal=null;toast('حُفظ الاسم');return}
 if(k==='addbrand'){const n=document.getElementById('ab_name').value.trim();if(!n){toast('اكتب اسم الشركة');return}if(S.brands.some(b=>b.name===n)){toast('الشركة موجودة مسبقًا');return}const nid=Date.now();S.brands.push({id:nid,name:n,country:document.getElementById('ab_country').value.trim()});if(S.page==='prodform')S.pf.brand=nid;audit('أضاف الشركة '+n,'منتجات');S.modal=null;toast('أُضيفت الشركة');return}
 return _mok(k,id);
};
const _render=render;
render=function(){_render();if(document.activeElement&&document.activeElement.id==='x')return};
function renderKeepFocus(id){const e0=document.getElementById(id),pos=e0?e0.selectionStart:0;render();const e=document.getElementById(id);if(e){e.focus();try{e.setSelectionRange(pos,pos)}catch(_){}}}
document.addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(d.newprod){S.pf=newPf();S.pfId=null;S.pfErr=[];go('prodform');return}
 if(d.editprod){const p=S.products.find(x=>x.id==d.editprod);S.pf=JSON.parse(JSON.stringify(p));if(!S.pf.specs.length)S.pf.specs=[{k:'',v:''}];S.pfId=p.id;S.pfErr=[];go('prodform');return}
 if(d.pfcancel){S.page='catalog';render();return}
 if(d.specadd){S.pf.specs.push({k:'',v:''});render();return}
 if(d.specdel!==undefined){S.pf.specs.splice(+d.specdel,1);if(!S.pf.specs.length)S.pf.specs=[{k:'',v:''}];render();return}
 if(d.pfm){const a=S.pf.models,i=a.indexOf(d.pfm);i<0?a.push(d.pfm):a.splice(i,1);render();return}
 if(d.pfimg){S.pf.imgs=(S.pf.imgs||0)+1;render();return}
 if(d.delcat){const c=S.cats.find(x=>x.id==d.delcat);if(kids(c.id).length){toast('لا يمكن الحذف: فيه تصنيفات فرعية');return}if(catCount(c.id)){toast('لا يمكن الحذف: فيه '+catCount(c.id)+' منتجات');return}S.cats=S.cats.filter(x=>x.id!==c.id);audit('حذف التصنيف '+c.name,'منتجات');toast('حُذف التصنيف');return}

function pfSave(){
 const p=S.pf,err=[],t=p.type,need=['جهاز','فلتر','قطعة'].includes(t);
 if(!p.name.trim())err.push('الاسم بالعربية مطلوب');
 if(!p.sku.trim())err.push('رمز المنتج (SKU) مطلوب');
 else if(S.products.some(x=>x.sku.toLowerCase()===p.sku.trim().toLowerCase()&&x.id!==S.pfId))err.push('رمز المنتج مستخدم في منتج آخر');
 if(!p.cat)err.push('اختر التصنيف');
 if(t!=='خدمة'&&!p.brand)err.push('اختر الشركة المصنعة');
 if(!(+p.price>0))err.push('سعر البيع يجب أن يكون أكبر من صفر');
 if(need&&p.track&&(p.reorder===''||+p.reorder<0))err.push('حد إعادة الطلب مطلوب');
 if(t==='فلتر'&&!(+p.life>0))err.push('العمر الافتراضي للفلتر مطلوب');
 if((t==='فلتر'||t==='قطعة')&&!p.models.length)err.push('اختر موديلًا واحدًا على الأقل للتوافق');
 if(p.pub&&!(S.cats.find(c=>c.id==p.cat)||{}).vis)err.push('التصنيف مخفي في المتجر، أظهره أو اختر غيره قبل النشر');
 S.pfErr=err;if(err.length){render();return}
 const out={...p,id:S.pfId||Date.now(),sku:p.sku.trim(),name:p.name.trim(),cat:+p.cat,brand:+p.brand||0,price:+p.price,cost:+p.cost||0,reorder:+p.reorder||0,warranty:+p.warranty||0,life:+p.life||'',stage:+p.stage||'',pub:!!p.pub,specs:p.specs.filter(s=>s.k.trim()||s.v.trim())};
 if(S.pfId){const i=S.products.findIndex(x=>x.id===S.pfId);const old=S.products[i];S.products[i]=out;audit('عدّل المنتج '+out.name+(old.price!==out.price?' (السعر من '+fmt(old.price)+' إلى '+fmt(out.price)+')':''),'منتجات')}
 else{S.products.push(out);audit('أضاف المنتج '+out.name+' ('+out.sku+') '+(out.pub?'منشورًا':'كمسودة'),'منتجات')}
 S.page='catalog';S.prodTab='products';S.pfil={q:'',cat:'',brand:'',type:'',st:''};render();toast(S.pfId?'حُفظت التعديلات':'حُفظ المنتج');
}

 const m=S.modal;if(!m)return '';const [k,id]=m.split(':');
 if(k==='adduser')return `<div class="modal" role="dialog" aria-modal="true"><div><h3 class="h3">إضافة مستخدم</h3><div class="field"><label for="au_name">الاسم</label><input class="input" id="au_name"></div><div class="field"><label for="au_phone">رقم الجوال</label><input class="input" id="au_phone" dir="ltr" style="text-align:start"></div><div class="field"><label for="au_role">الدور</label><select class="sel" id="au_role">${opts(Object.keys(ROLES).filter(r=>r!=='مدير النظام'),'')}</select></div><div class="field"><label for="au_code">رمز الدخول (6 أرقام)</label><div class="row"><input class="input" id="au_code" dir="ltr" style="text-align:start" value="${S.newCode||(S.newCode=rnd6())}" inputmode="numeric"><button class="btn sm sec" data-gencode="au_code">توليد</button></div></div><div class="row"><button class="btn" data-mok="adduser:0">إضافة</button><button class="btn ghost" data-mclose="1">إلغاء</button></div></div></div>`;
 if(k==='ucode'){const u=S.users.find(x=>x.id==id);return `<div class="modal" role="dialog" aria-modal="true"><div><h3 class="h3">تغيير رمز ${u.name}</h3><div class="field"><label for="uc_code">الرمز الجديد (6 أرقام)</label><div class="row"><input class="input" id="uc_code" dir="ltr" style="text-align:start" value="${rnd6()}" inputmode="numeric"><button class="btn sm sec" data-gencode="uc_code">توليد</button></div></div><div class="muted">سيُنهى دخول المستخدم الحالي ويُبلَّغ بالرمز الجديد.</div><div class="row" style="margin-top:12px"><button class="btn" data-mok="ucode:${id}">حفظ</button><button class="btn ghost" data-mclose="1">إلغاء</button></div></div></div>`}
 return _mh2();
};
const _mok2=mok;
mok=function(k,id){
 const codeOk=c=>/^\d{6}$/.test(c);
 if(k==='adduser'){const n=document.getElementById('au_name').value.trim(),p=document.getElementById('au_phone').value.trim(),c=document.getElementById('au_code').value.trim();
  if(!n||!/^05\d{8}$/.test(p)){toast('الاسم وجوال صحيح (05xxxxxxxx) مطلوبان');return}
  if(S.users.some(u=>u.phone===p)){toast('هذا الجوال مسجل لمستخدم آخر');return}
  if(!codeOk(c)){toast('الرمز 6 أرقام');return}
  if(S.users.some(u=>u.code===c)){toast('الرمز مستخدم، اختر رمزًا آخر');return}
  S.users.push({id:Date.now(),name:n,phone:p,role:document.getElementById('au_role').value,active:true,last:'لم يدخل بعد',code:c});S.newCode=null;audit('أضاف المستخدم '+n,'مستخدمون');S.modal=null;toast('أُضيف المستخدم');return}
 if(k==='ucode'){const c=document.getElementById('uc_code').value.trim();if(!codeOk(c)){toast('الرمز 6 أرقام');return}if(S.users.some(u=>u.code===c&&u.id!=id)){toast('الرمز مستخدم، اختر رمزًا آخر');return}const u=S.users.find(x=>x.id==id);u.code=c;audit('غيّر رمز دخول '+u.name,'مستخدمون');S.modal=null;toast('تم تغيير الرمز');return}
 return _mok2(k,id);
};
document.addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(d.aptab){S.apTab=d.aptab;render();return}
 if(d.showcode){S.showCode=S.showCode==d.showcode?null:+d.showcode;render();return}
 if(d.gencode){document.getElementById(d.gencode).value=rnd6();return}
 if(d.ires){const l=S.ilog.find(x=>x.id===d.ires);l.st='ناجح';delete l.why;audit('صحّح بيانات '+l.id+' فأُعيدت العملية ('+l.sys+')','تكاملات');toast('صُحّحت البيانات وأُعيدت العملية تلقائيًا');render();return}
 if(d.savepol){['retryN','retryMin','awaitH'].forEach(k=>{S.pol[k]=Math.max(1,+document.getElementById('p_'+k).value||S.pol[k])});audit('عدّل سياسة إعادة المحاولة','تكاملات');toast('حُفظت السياسة');return}
});
document.addEventListener('change',e=>{
 const i=e.target,d=i.dataset;
 if(d.ron!==undefined){const r=S.rules[+d.ron];r.on=i.checked;audit((r.on?'أوجب الموافقة على: ':'جعل مباشرًا: ')+r.label,'موافقات');render();return}
 if(d.rthr!==undefined){const r=S.rules[+d.rthr];r.thr=Math.max(0,+i.value||0);audit('عدّل حد الموافقة على «'+r.label+'» إلى '+r.thr+' '+r.unit,'موافقات');toast('حُفظ الحد');return}
});

render();
</script>
</html>
